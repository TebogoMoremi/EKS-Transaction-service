apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: eks-transactions-rds-secret
  namespace: eks-transactions
spec:
  provider: aws

  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "arn:aws:secretsmanager:af-south-1:263953131930:secret:rds!db-16e1b0ac-2103-434a-b9a8-b1d8e082f748-auDRgP"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "dbUsername"
          - path: "password"
            objectAlias: "dbPassword"
