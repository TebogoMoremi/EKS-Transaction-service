name: Build and Deploy to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: af-south-1
  AWS_ACCOUNT_ID: "263953131930"
  ECR_REPOSITORY: eks-transactions-service
  EKS_CLUSTER: eks-transactions-cluster
  K8S_NAMESPACE: eks-transactions
  K8S_DEPLOYMENT: eks-transactions-service
  K8S_CONTAINER: eks-transactions-service
  AWS_ROLE_ARN: arn:aws:iam::263953131930:role/GitHubActionsEKSTransactionRole

jobs:
  build-test-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java --version
          mvn --version

      - name: Build and run tests
        run: mvn --batch-mode verify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set Docker image variables
        run: |
          echo "ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
          docker login \
            --username AWS \
            --password-stdin \
            "$ECR_REGISTRY"

      - name: Build Docker image
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building $IMAGE_URI"

          docker build \
            -t "$IMAGE_URI" \
            .

      - name: Push Docker image to ECR
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE"

          kubectl get pods \
            -n "$K8S_NAMESPACE"

      - name: Deploy to EKS
        run: |
          kubectl set image \
            deployment/$K8S_DEPLOYMENT \
            $K8S_CONTAINER=$IMAGE_URI \
            -n $K8S_NAMESPACE

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/$K8S_DEPLOYMENT \
            -n $K8S_NAMESPACE \
            --timeout=300s

      - name: Verify deployment
        run: |
          echo "Deployed image:"
          kubectl get deployment "$K8S_DEPLOYMENT" \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo
          echo "Pods:"
          kubectl get pods -n "$K8S_NAMESPACE"
